services:
  - type: worker
    name: uzum-pro-bot
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: python bot.py
    envVars:
      - key: BOT_TOKEN
        sync: false
      - key: ADMIN_ID
        sync: false
      - key: WEB_APP_URL
        sync: false
      - key: SHOP_NAME
        value: UZUM MARKET
      - key: SUPPORT
        value: "@Uzum_Amazon_support"
      - key: ADMIN_PASSWORD
        sync: false
      - key: SECRET_KEY
        sync: false
      - key: DB_NAME
        value: uzum_market.db

  - type: web
    name: uzum-pro-web
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: python app.py
    envVars:
      - key: BOT_TOKEN
        sync: false
      - key: ADMIN_ID
        sync: false
      - key: WEB_APP_URL
        sync: false
      - key: SHOP_NAME
        value: UZUM MARKET
      - key: SUPPORT
        value: "@Uzum_Amazon_support"
      - key: ADMIN_PASSWORD
        sync: false
      - key: SECRET_KEY
        sync: false
      - key: DB_NAME
        value: uzum_market.db
